<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股東會紀念品 — 登入</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; background: #0f172a; color: #e2e8f0; }
  .header { background: linear-gradient(135deg, #1e293b, #334155); padding: 20px; text-align: center; border-bottom: 3px solid #f59e0b; }
  .header h1 { font-size: 1.6rem; color: #f59e0b; }
  .header p { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }
  .container { max-width: 560px; margin: 0 auto; padding: 16px; }
  .nav { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .nav a { padding: 8px 16px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
  .nav a:hover { background: #334155; color: #e2e8f0; }
  .nav a.active { background: #f59e0b; color: #1e293b; font-weight: bold; }
  .card { background: #1e293b; border-radius: 10px; padding: 22px; border: 1px solid #334155; }
  .card h2 { color: #f59e0b; font-size: 1.15rem; margin-bottom: 16px; text-align: center; }
  label { display: block; color: #94a3b8; font-size: 0.8rem; margin: 10px 0 4px; }
  input { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 0.95rem; }
  input:focus { outline: none; border-color: #f59e0b; }
  .btn { display: block; width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 16px; }
  .btn-primary { background: #f59e0b; color: #1e293b; }
  .btn-primary:hover { background: #d97706; }
  .msg { text-align: center; font-size: 0.85rem; margin-top: 10px; min-height: 20px; }
  .msg.ok { color: #4ade80; }
  .msg.err { color: #ef4444; }
  .footer { text-align: center; color: #64748b; font-size: 0.75rem; margin-top: 16px; }
  .user-card { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 16px; margin-bottom: 16px; display: none; }
  .user-card .uc-code { color: #f59e0b; font-size: 1.1rem; font-weight: bold; }
  .user-card .uc-info { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }
  .user-card .uc-group { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; background: #f59e0b33; color: #f59e0b; margin-top: 6px; }
</style>
</head>
<body>
<div class="header">
  <h1>📦 股東會紀念品 — 登入</h1>
  <p>會員登入管理主帳號與子帳號</p>
</div>

<div class="container">
  <div class="nav">
    <a href="index.html">📋 紀念品查詢</a>
    <a href="account.html" class="nav-member">👤 帳戶管理</a>
    <a href="login.html" class="active" id="navLogin">🔐 登入</a>
    <a href="register.html" class="nav-guest">📝 註冊</a>
    <a href="rename.html" class="nav-member">📄 批次改名</a>
    <a href="merge.html" class="nav-member">✂️ 截取合併</a>
    <span id="navUser" style="display:none; padding:8px 16px; border-radius:8px; background:#22c55e33; color:#4ade80; font-size:0.85rem; font-weight:bold;"></span>
  </div>

  <!-- 已登入狀態 -->
  <div class="user-card" id="userCard">
    <div class="uc-code" id="ucCode"></div>
    <div class="uc-info" id="ucInfo"></div>
    <span class="uc-group" id="ucGroup"></span>
    <div style="margin-top:12px;">
      <button class="btn btn-primary" onclick="goAccount()">👤 前往帳戶管理</button>
      <button class="btn btn-red" style="background:#ef4444;color:#fff;display:inline-block;width:auto;padding:10px 20px;margin-top:8px;" onclick="logout()">🚪 登出</button>
    </div>
  </div>

  <!-- 登入表單 -->
  <div class="card" id="loginForm">
    <h2>🔐 會員登入</h2>

    <label>Email（Gmail）</label>
    <input type="email" id="loginEmail" placeholder="you@gmail.com">

    <label>密碼</label>
    <input type="password" id="loginPass" placeholder="您的密碼">

    <button class="btn btn-primary" onclick="login()">🔐 登入</button>
    <div class="msg" id="loginMsg"></div>
    <div class="footer" style="margin-top:12px;">
      還沒有帳號？<a href="register.html" style="color:#f59e0b;">立即註冊（自動編碼）</a>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
const USERS_KEY = 'souvenir_users';
const SESSION_KEY = 'souvenir_session';

function loadUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY)) || []; }
  catch(e) { return []; }
}

function getSession() {
  return localStorage.getItem(SESSION_KEY);
}

function login() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const msg = document.getElementById('loginMsg');

  if (!email || !pass) {
    msg.className = 'msg err'; msg.textContent = '❌ 請輸入 Email 和密碼'; return;
  }

  const users = loadUsers();
  const user = users.find(u => u.email.toLowerCase() === email);

  if (!user || user.pass !== pass) {
    msg.className = 'msg err'; msg.textContent = '❌ Email 或密碼錯誤'; return;
  }

  // 建立 session
  localStorage.setItem(SESSION_KEY, user.email);
  msg.className = 'msg ok';
  msg.textContent = '✅ 登入成功！';
  setTimeout(() => {
    window.location.href = 'account.html?user=' + encodeURIComponent(user.email);
  }, 800);
}

function logout() {
  localStorage.removeItem(SESSION_KEY);
  window.location.reload();
}

function goAccount() {
  const email = getSession();
  if (email) window.location.href = 'account.html?user=' + encodeURIComponent(email);
}

function init() {
  const email = getSession();
  if (!email) return;

  const users = loadUsers();
  const user = users.find(u => u.email === email);
  if (!user) return;

  // 顯示已登入卡片
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('userCard').style.display = 'block';
  document.getElementById('ucCode').textContent =
    `${user.memberId || 'M---'} · ${user.certCode || 'L2-XX'}`;
  document.getElementById('ucInfo').textContent =
    `${user.name || ''}（${user.email}）`;
  document.getElementById('ucGroup').textContent = user.group || '';
}

init();
</script>
</body>
</html>

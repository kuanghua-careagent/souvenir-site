<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股東會紀念品查詢</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; background: #0f172a; color: #e2e8f0; }
  .header { background: linear-gradient(135deg, #1e293b, #334155); padding: 20px; text-align: center; border-bottom: 3px solid #f59e0b; }
  .header h1 { font-size: 1.6rem; color: #f59e0b; }
  .header p { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }
  .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .nav { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .nav a { padding: 8px 16px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
  .nav a:hover { background: #334155; color: #e2e8f0; }
  .nav a.active { background: #f59e0b; color: #1e293b; font-weight: bold; }
  .tab { padding: 8px 16px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #94a3b8; cursor: pointer; font-size: 0.9rem; }
  .tab:hover { background: #334155; color: #e2e8f0; }
  .tab.active { background: #f59e0b; color: #1e293b; font-weight: bold; border-color: #f59e0b; }
  .tab .cnt { opacity: 0.7; font-size: 0.75rem; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 200px; padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #e2e8f0; font-size: 0.95rem; }
  .toolbar button { padding: 10px 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
  .btn-search { background: #f59e0b; color: #1e293b; }
  .btn-excel { background: #22c55e; color: #052e16; }
  .table-wrap { overflow-x: auto; background: #1e293b; border-radius: 8px; max-height: 70vh; }
  table { width: 100%; border-collapse: collapse; min-width: 1200px; }
  th { background: #334155; color: #f59e0b; padding: 10px 8px; text-align: center; font-size: 1.05rem; white-space: nowrap; position: sticky; top: 0; cursor: pointer; user-select: none; }
  th:hover { background: #475569; }
  th .arrow { font-size: 0.9rem; margin-left: 3px; }
  th .sort-hint { font-size: 0.85rem; opacity: 0.5; margin-left: 3px; }
  td { padding: 8px; border-top: 1px solid #2d3748; font-size: 1.05rem; text-align: center; }
  tr:hover { background: #2d3748; }
  .gift { color: #4ade80; }
  .date { color: #fbbf24; white-space: nowrap; }
  .sub { color: #94a3b8; font-size: 0.9rem; }
  .meta { text-align: center; color: #64748b; font-size: 1rem; margin-top: 14px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.9rem; }
  .badge-y { background: #f59e0b33; color: #f59e0b; }
  .badge-k { background: #3b82f633; color: #60a5fa; }
  .loading { text-align: center; padding: 40px; color: #94a3b8; }
  .stats { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-bottom: 10px; }
  .stats b { color: #f59e0b; }
</style>
</head>
<body>
<div class="header">
  <h1>📦 股東會紀念品查詢</h1>
  <p>股東會紀念品查詢系統</p>
</div>

<div class="container">
  <div class="nav" id="mainNav">
    <a href="index.html" class="active">📋 紀念品查詢</a>
    <a href="account.html" class="nav-member">👤 帳戶管理</a>
    <a href="login.html" id="navLogin">🔐 登入</a>
    <a href="register.html" class="nav-guest">📝 註冊</a>
    <a href="rename.html" class="nav-member">📄 批次改名</a>
    <a href="merge.html" class="nav-member">✂️ 截取合併</a>
    <span id="navUser" style="display:none; padding:8px 16px; border-radius:8px; background:#22c55e33; color:#4ade80; font-size:0.85rem; font-weight:bold;"></span>
  </div>
  <div class="tabs" id="tabs"></div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="輸入公司代號或名稱，例如：1101 / 台泥 / 台積電">
    <button class="btn-search" onclick="search()">🔍 查詢</button>
    <button class="btn-excel" onclick="exportExcel()">📊 匯出 Excel</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="table-wrap">
    <table id="dataTable">
      <thead>
        <tr>
          <th onclick="sortBy('code')">代號<span class="arrow" id="arr-code"></span><span class="sort-hint">↕</span></th>
          <th onclick="sortBy('name')">公司<span class="arrow" id="arr-name"></span><span class="sort-hint">↕</span></th>
          <th onclick="sortBy('gift')">紀念品<span class="arrow" id="arr-gift"></span><span class="sort-hint">↕</span></th>
          <th onclick="sortBy('pure')">純發領取<span class="arrow" id="arr-pure"></span><span class="sort-hint">↕</span></th>
          <th onclick="sortBy('evote')">電投領取<span class="arrow" id="arr-evote"></span><span class="sort-hint">↕</span></th>
          <th onclick="sortBy('evote_docs')">電投文件<span class="arrow" id="arr-evote_docs"></span><span class="sort-hint">↕</span></th>
          <th onclick="sortBy('entrust')">委發領取<span class="arrow" id="arr-entrust"></span><span class="sort-hint">↕</span></th>
          <th onclick="sortBy('entrust_loc_1')">委發(1股)<span class="arrow" id="arr-entrust_loc_1"></span><span class="sort-hint">↕</span></th>
          <th onclick="sortBy('meeting_date')">開會日<span class="arrow" id="arr-meeting_date"></span><span class="sort-hint">↕</span></th>
          <th onclick="sortBy('meeting_location')">開會地<span class="arrow" id="arr-meeting_location"></span><span class="sort-hint">↕</span></th>
          <th onclick="sortBy('last_buy_date')">最後買進日<span class="arrow" id="arr-last_buy_date"></span><span class="sort-hint">↕</span></th>
          <th onclick="sortBy('agent')">股代<span class="arrow" id="arr-agent"></span><span class="sort-hint">↕</span></th>
          <th onclick="sortBy('price')">股價<span class="arrow" id="arr-price"></span><span class="sort-hint">↕</span></th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="15" class="loading">載入資料中...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="meta">
    本網站僅供參考，實際以公開資訊觀測站公告為準
  </div>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="auth.js"></script>
<script>
let DB = null;
let currentTab = 'all';
let sortKey = null;
let sortDir = 1;
let currentRows = [];
// 每頁獨立狀態：tabKey -> {sortKey, sortDir, query}
const tabStates = {};

const TABS = [
  {key: 'all', label: '📋 全部', filter: null},
  {key: '2025常會', label: '2025 常會', filter: m => m.year == '2025' && m.kind == '常會'},
  {key: '2025臨時會', label: '2025 臨時會', filter: m => m.year == '2025' && m.kind == '臨時會'},
  {key: '2026常會', label: '2026 常會', filter: m => m.year == '2026' && m.kind == '常會'},
  {key: '2026臨時會', label: '2026 臨時會', filter: m => m.year == '2026' && m.kind == '臨時會'},
];

async function loadData() {
  // 全站會員制：未登入跳轉登入頁
  if (!requireAuth()) return;
  applyAuthNav();
  try {
    const res = await fetch('souvenir_db.json');
    DB = await res.json();
    buildTabs();
    refresh();
  } catch(e) {
    document.getElementById('tableBody').innerHTML =
      '<tr><td colspan="15" class="loading">❌ 資料載入失敗</td></tr>';
  }
}

function buildTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = TABS.map(t => {
    let cnt = '';
    if (t.key !== 'all' && DB.meta.page_stats) {
      cnt = DB.meta.page_stats[t.key] || 0;
    }
    return `<div class="tab ${t.key === currentTab ? 'active' : ''}" onclick="switchTab('${t.key}')">${t.label} <span class="cnt">${cnt ? '(' + cnt + ')' : ''}</span></div>`;
  }).join('');
}

function switchTab(key) {
  // 保存目前頁狀態
  tabStates[currentTab] = {sortKey, sortDir, query: document.getElementById('searchInput').value.trim()};
  // 切頁
  currentTab = key;
  // 恢復目標頁狀態
  const st = tabStates[key] || {sortKey: null, sortDir: 1, query: ''};
  sortKey = st.sortKey;
  sortDir = st.sortDir;
  document.getElementById('searchInput').value = st.query;
  // 更新箭頭
  document.querySelectorAll('th .arrow').forEach(a => a.textContent = '');
  if (sortKey) {
    const arr = document.getElementById('arr-' + sortKey);
    if (arr) arr.textContent = sortDir === 1 ? '▲' : '▼';
  }
  buildTabs();
  refresh();
}

/** 過濾：紀念品為「無」的不顯示（未定保留） */
function isGiftMeaningful(gift) {
  if (!gift) return false;
  const g = String(gift).trim();
  if (g === '無' || g === '-' || g === '不發') return false;
  return true;
}

function getMeeting(c) {
  const tab = TABS.find(t => t.key === currentTab);
  if (tab && tab.filter) {
    return c.meetings.find(tab.filter) || null;
  }
  return c.meetings[c.meetings.length - 1] || null;
}

function refresh() {
  const rows = [];
  for (const c of DB.companies) {
    const m = getMeeting(c);
    if (!m) continue;
    if (!isGiftMeaningful(m.gift)) continue;  // 「無」不顯示
    rows.push({company: c, meeting: m});
  }
  currentRows = rows;
  document.getElementById('stats').innerHTML =
    `<span>📊 顯示 <b>${rows.length}</b> 家公司</span>`;
  if (sortKey) applySort();
  else {
    // 套用該頁搜尋詞
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (q) {
      const filtered = rows.filter(r =>
        r.company.code.toLowerCase().includes(q) || r.company.name.toLowerCase().includes(q)
      );
      renderRows(filtered);
    } else {
      renderRows(rows);
    }
  }
}

function renderRows(rows) {
  const tbody = document.getElementById('tableBody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="13" class="loading">沒有符合的資料</td></tr>';
    return;
  }
  tbody.innerHTML = rows.slice(0, 500).map(r => {
    const c = r.company, m = r.meeting;
    return `
    <tr>
      <td><strong>${c.code}</strong></td>
      <td>${c.name}</td>
      <td class="gift">${m.gift || '-'}</td>
      <td class="date">${m.pure_start ? m.pure_start + '~' + m.pure_end : '-'}</td>
      <td class="date">${m.evote_start ? m.evote_start + '~' + m.evote_end : '-'}<br><span class="sub">${m.evote_location || ''}</span></td>
      <td class="sub">${m.evote_docs || '-'}</td>
      <td class="date">${m.entrust_start ? m.entrust_start + '~' + m.entrust_end : '-'}</td>
      <td class="sub">${m.entrust_loc_1 || '-'}</td>
      <td class="date">${m.meeting_date || '-'}</td>
      <td class="sub">${m.meeting_location || '-'}</td>
      <td class="date">${m.last_buy_date || '-'}</td>
      <td class="sub">${m.agent || '-'}<br>${m.agent_phone || ''}</td>
      <td>${m.est_price || '-'}</td>
    </tr>`;
  }).join('');
}

/** 排序 */
function sortBy(key) {
  if (sortKey === key) sortDir = -sortDir;
  else { sortKey = key; sortDir = 1; }
  // 更新箭頭
  document.querySelectorAll('th .arrow').forEach(a => a.textContent = '');
  const arr = document.getElementById('arr-' + key);
  if (arr) arr.textContent = sortDir === 1 ? '▲' : '▼';
  applySort();
}

function applySort() {
  const val = r => {
    const m = r.meeting;
    const v = {code: r.company.code, name: r.company.name, gift: m.gift, pure: m.pure_start, evote: m.evote_start, evote_docs: m.evote_docs, entrust: m.entrust_start, entrust_loc_1: m.entrust_loc_1, meeting_date: m.meeting_date, meeting_location: m.meeting_location, last_buy_date: m.last_buy_date, agent: m.agent, reelection: m.reelection, zero_lot_mail: m.zero_lot_mail, price: parseFloat(m.est_price) || -1}[sortKey];
    return v === undefined || v === null ? '' : v;
  };
  // 套用該頁搜尋詞
  let rows = currentRows;
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (q) {
    rows = rows.filter(r =>
      r.company.code.toLowerCase().includes(q) || r.company.name.toLowerCase().includes(q)
    );
  }
  const sorted = [...rows].sort((a, b) => {
    const va = val(a), vb = val(b);
    if (va === vb) return 0;
    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * sortDir;
    return String(va).localeCompare(String(vb), 'zh-Hant') * sortDir;
  });
  renderRows(sorted);
}

function search() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!q || !DB) return;
  const results = currentRows.filter(r =>
    r.company.code.toLowerCase().includes(q) || r.company.name.toLowerCase().includes(q)
  );
  renderRows(results.slice(0, 500));
}

/** 匯出 Excel（目前頁面） */
function exportExcel() {
  if (!currentRows.length) return;
  const tab = TABS.find(t => t.key === currentTab);
  const headers = ['代號','公司','紀念品','純發領取','電投領取','電投文件','委發領取','委發(1股)','開會日','開會地','最後買進日','股代','改選','零股寄單','股價'];
  const data = [headers];
  for (const r of currentRows) {
    const c = r.company, m = r.meeting;
    data.push([
      c.code, c.name, m.gift || '',
      m.pure_start ? m.pure_start + '~' + m.pure_end : '',
      m.evote_start ? m.evote_start + '~' + m.evote_end : '',
      m.evote_docs || '', m.entrust_start ? m.entrust_start + '~' + m.entrust_end : '',
      m.entrust_loc_1 || '', m.meeting_date || '', m.meeting_location || '',
      m.last_buy_date || '', m.agent || '', m.reelection || '', m.zero_lot_mail || '',
      m.est_price || ''
    ]);
  }
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, tab ? tab.label : '全部');
  XLSX.writeFile(wb, `股東會紀念品_${tab ? tab.label : '全部'}.xlsx`);
}

document.getElementById('searchInput').addEventListener('keyup', e => {
  if (e.key === 'Enter') search();
});

loadData();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股東會紀念品查詢</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; background: #0f172a; color: #e2e8f0; }
  .header { background: linear-gradient(135deg, #1e293b, #334155); padding: 24px; text-align: center; border-bottom: 3px solid #f59e0b; }
  .header h1 { font-size: 1.8rem; color: #f59e0b; }
  .header p { color: #94a3b8; font-size: 0.9rem; margin-top: 6px; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
  .search-bar input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #e2e8f0; font-size: 1rem; }
  .search-bar button { padding: 12px 24px; border-radius: 8px; border: none; background: #f59e0b; color: #1e293b; font-weight: bold; cursor: pointer; }
  .search-bar button:hover { background: #d97706; }
  table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
  th { background: #334155; color: #f59e0b; padding: 10px 8px; text-align: left; font-size: 0.8rem; white-space: nowrap; }
  td { padding: 8px; border-top: 1px solid #2d3748; font-size: 0.82rem; }
  tr:hover { background: #2d3748; }
  .gift { color: #4ade80; }
  .date { color: #fbbf24; white-space: nowrap; }
  .meta { text-align: center; color: #64748b; font-size: 0.8rem; margin-top: 16px; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.7rem; }
  .badge-y { background: #f59e0b33; color: #f59e0b; }
  .badge-k { background: #3b82f633; color: #60a5fa; }
  .badge-st { background: #4ade8033; color: #4ade80; }
  .loading { text-align: center; padding: 40px; color: #94a3b8; }
  .meeting-sub { color: #94a3b8; font-size: 0.75rem; }
  .stats { display: flex; gap: 20px; justify-content: center; margin-bottom: 16px; color: #94a3b8; font-size: 0.85rem; flex-wrap: wrap; }
  .stats b { color: #f59e0b; }
</style>
</head>
<body>
<div class="header">
  <h1>📦 股東會紀念品查詢</h1>
  <p>資料來源：公開資訊觀測站（MOPS）+ gnepin 會員資料｜整理觀點參考 twsouvenir.github.io</p>
</div>

<div class="container">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="輸入公司代號或名稱，例如：1101 / 台泥 / 台積電">
    <button onclick="search()">🔍 查詢</button>
  </div>

  <div class="stats" id="stats"></div>

  <table>
    <thead>
      <tr>
        <th>代號</th>
        <th>公司</th>
        <th>年度/種類</th>
        <th>開會日</th>
        <th>最後買進日</th>
        <th>紀念品</th>
        <th>電投領取</th>
        <th>委發領取</th>
        <th>股代</th>
        <th>預估股價</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="10" class="loading">載入資料中...</td></tr>
    </tbody>
  </table>

  <div class="meta">
    資料庫 <span id="count">0</span> 家公司 ｜ <span id="meetCount">0</span> 場會議 ｜ 更新時間 <span id="updated">-</span>
    <br>本網站僅供參考，實際以公開資訊觀測站公告為準
  </div>
</div>

<script>
let DB = null;

async function loadData() {
  try {
    const res = await fetch('souvenir_db.json');
    DB = await res.json();
    document.getElementById('count').textContent = DB.meta.company_count;
    document.getElementById('meetCount').textContent = DB.meta.meeting_count;
    document.getElementById('updated').textContent = DB.meta.updated;
    document.getElementById('stats').innerHTML =
      `<span>📊 公司 <b>${DB.meta.company_count}</b> 家</span>` +
      `<span>🗓️ 會議 <b>${DB.meta.meeting_count}</b> 場</span>` +
      `<span>📅 資料源 <b>MOPS + gnepin</b></span>`;
    render(DB.companies.slice(0, 40));
  } catch(e) {
    document.getElementById('tableBody').innerHTML =
      '<tr><td colspan="10" class="loading">❌ 資料載入失敗</td></tr>';
  }
}

function render(companies) {
  const tbody = document.getElementById('tableBody');
  if (!companies.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="loading">沒有符合的資料</td></tr>';
    return;
  }
  tbody.innerHTML = companies.map(c => {
    // 顯示最近的會議（預設最後一場）
    const m = c.meetings[c.meetings.length - 1] || {};
    return `
    <tr>
      <td><strong>${c.code}</strong></td>
      <td>${c.name}</td>
      <td><span class="badge badge-y">${m.year || '-'}</span> <span class="badge badge-k">${m.kind || '-'}</span></td>
      <td class="date">${m.meeting_date || '-'}</td>
      <td class="date">${m.last_buy_date || '-'}</td>
      <td class="gift">${m.gift || '-'}</td>
      <td class="meeting-sub">${m.evote_start ? m.evote_start + '~' + m.evote_end : '-'}<br>${m.evote_location || ''}</td>
      <td class="meeting-sub">${m.entrust_start ? m.entrust_start + '~' + m.entrust_end : '-'}<br>${m.entrust_loc_1k || ''}</td>
      <td class="meeting-sub">${m.agent || '-'}<br>${m.agent_phone || ''}</td>
      <td>${m.est_price || '-'}</td>
    </tr>`;
  }).join('');
}

function search() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!q || !DB) return;
  const results = DB.companies.filter(c =>
    c.code.toLowerCase().includes(q) || c.name.toLowerCase().includes(q)
  );
  render(results.slice(0, 40));
}

document.getElementById('searchInput').addEventListener('keyup', e => {
  if (e.key === 'Enter') search();
});

loadData();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股東會紀念品 — 帳戶管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; background: #0f172a; color: #e2e8f0; }
  .header { background: linear-gradient(135deg, #1e293b, #334155); padding: 20px; text-align: center; border-bottom: 3px solid #f59e0b; }
  .header h1 { font-size: 1.6rem; color: #f59e0b; }
  .header p { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }
  .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .nav { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .nav a { padding: 8px 16px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
  .nav a:hover { background: #334155; color: #e2e8f0; }
  .nav a.active { background: #f59e0b; color: #1e293b; font-weight: bold; }
  .card { background: #1e293b; border-radius: 10px; padding: 18px; margin-bottom: 16px; border: 1px solid #334155; }
  .card h2 { color: #f59e0b; font-size: 1.1rem; margin-bottom: 12px; }
  .card h3 { color: #e2e8f0; font-size: 0.95rem; margin: 12px 0 8px; }
  label { display: block; color: #94a3b8; font-size: 0.8rem; margin: 8px 0 4px; }
  input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 0.9rem; margin-bottom: 4px; }
  input:focus, select:focus { outline: none; border-color: #f59e0b; }
  .btn { display: inline-block; padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; margin: 4px 4px 4px 0; }
  .btn-primary { background: #f59e0b; color: #1e293b; }
  .btn-green { background: #22c55e; color: #052e16; }
  .btn-red { background: #ef4444; color: #fff; }
  .btn-gray { background: #475569; color: #e2e8f0; }
  .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
  /* 子帳戶網格 */
  .sub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .sub-card { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 14px; }
  .sub-card .name { font-weight: bold; color: #f59e0b; font-size: 0.95rem; }
  .sub-card .id { color: #64748b; font-size: 0.75rem; margin: 2px 0 8px; }
  .sub-card .count { color: #94a3b8; font-size: 0.8rem; margin-bottom: 8px; }
  .sub-card .actions { display: flex; gap: 6px; }
  /* 持股表格 */
  table { width: 100%; border-collapse: collapse; background: #0f172a; border-radius: 8px; overflow: hidden; }
  th { background: #334155; color: #f59e0b; padding: 8px; text-align: left; font-size: 0.8rem; }
  td { padding: 8px; border-top: 1px solid #2d3748; font-size: 0.85rem; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; margin-right: 4px; }
  .tag-hold { background: #4ade8033; color: #4ade80; }
  .tag-need { background: #f59e0b33; color: #f59e0b; }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-bar .btn { margin: 0; }
  .filter-bar .btn.active { background: #f59e0b; color: #1e293b; }
  .stats { color: #94a3b8; font-size: 0.8rem; margin-bottom: 8px; }
  .hidden { display: none; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-bg.show { display: flex; }
  .modal { background: #1e293b; border-radius: 12px; padding: 24px; width: 90%; max-width: 480px; max-height: 85vh; overflow-y: auto; }
  .modal h2 { color: #f59e0b; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="header">
  <h1>📦 股東會紀念品 — 帳戶管理</h1>
  <p>主帳戶 + 9 子帳戶｜持股篩選｜註冊</p>
</div>

<div class="container">
  <div class="nav">
    <a href="index.html">📋 紀念品查詢</a>
    <a href="account.html" class="active">👤 帳戶管理</a>
    <a href="register.html">📝 註冊</a>
  </div>

  <!-- 主帳戶資訊 -->
  <div class="card">
    <h2>👤 主帳戶</h2>
    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      <div style="flex:1; min-width:200px;">
        <label>姓名</label>
        <input type="text" id="masterName" value="彭光華">
      </div>
      <div style="flex:1; min-width:200px;">
        <label>身分證字號</label>
        <input type="text" id="masterId" value="E121857808">
      </div>
      <div style="flex:1; min-width:200px;">
        <label>電話</label>
        <input type="text" id="masterTel" value="0932895357">
      </div>
    </div>
    <div style="margin-top:12px;">
      <button class="btn btn-primary" onclick="saveMaster()">💾 儲存主帳戶</button>
      <span id="masterMsg" style="color:#4ade80; font-size:0.85rem; margin-left:8px;"></span>
    </div>
  </div>

  <!-- 子帳戶列表 -->
  <div class="card">
    <h2>👨‍👩‍👧 子帳戶（<span id="subCount">0</span>/9）</h2>
    <p style="color:#64748b; font-size:0.8rem; margin-bottom:12px;">每個子帳戶可記錄不同家人的持股，分別篩選「我的持股」與「需要補充」</p>
    <div class="sub-grid" id="subGrid"></div>
    <div style="margin-top:14px;">
      <button class="btn btn-green" onclick="openSubModal()" id="addSubBtn">➕ 新增子帳戶</button>
      <span id="subMsg" style="color:#ef4444; font-size:0.85rem; margin-left:8px;"></span>
    </div>
  </div>

  <!-- 持股篩選 -->
  <div class="card">
    <h2>🔍 持股篩選</h2>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
      <select id="selectSub" style="max-width:250px;" onchange="loadHoldings()">
        <option value="">— 選擇子帳戶 —</option>
      </select>
      <button class="btn btn-primary" onclick="loadHoldings()">📂 載入持股</button>
    </div>
    <div class="filter-bar" id="filterBar" style="display:none;">
      <button class="btn btn-gray active" id="fAll" onclick="setFilter('all')">全部</button>
      <button class="btn btn-gray" id="fHold" onclick="setFilter('hold')">🟢 我的持股</button>
      <button class="btn btn-gray" id="fNeed" onclick="setFilter('need')">🟡 需要補充</button>
    </div>
    <div class="stats" id="holdStats"></div>
    <div class="table-wrap" style="overflow-x:auto;">
      <table>
        <thead><tr><th>代號</th><th>公司</th><th>紀念品</th><th>開會日</th><th>最後買進日</th><th>狀態</th></tr></thead>
        <tbody id="holdBody"><tr><td colspan="6" style="text-align:center; color:#64748b;">請先選擇子帳戶</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 子帳戶 Modal -->
<div class="modal-bg" id="subModal">
  <div class="modal">
    <h2 id="subModalTitle">➕ 新增子帳戶</h2>
    <label>顯示名稱</label>
    <input type="text" id="subName" placeholder="例：自己 / 太太 / 爸爸">
    <label>身分證字號</label>
    <input type="text" id="subId" placeholder="例：A123456789">
    <label>持股清單（用逗號分隔股票代號）</label>
    <input type="text" id="subHoldings" placeholder="例：1101,2330,0050,00685L">
    <div style="margin-top:16px; text-align:right;">
      <button class="btn btn-gray" onclick="closeSubModal()">取消</button>
      <button class="btn btn-green" onclick="saveSub()">✅ 儲存</button>
    </div>
    <input type="hidden" id="editIndex" value="-1">
  </div>
</div>

<script>
// ===== 資料模型：存 localStorage（之後套網站時改接後端） =====
const STORAGE_KEY = 'souvenir_accounts';

function loadAccounts() {
  const raw = localStorage.getItem(STORAGE_KEY);
  return raw ? JSON.parse(raw) : {master: {}, subs: []};
}

function saveAccounts(acc) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(acc));
}

// ===== 主帳戶 =====
function saveMaster() {
  const acc = loadAccounts();
  acc.master = {
    name: document.getElementById('masterName').value,
    id: document.getElementById('masterId').value,
    tel: document.getElementById('masterTel').value,
  };
  saveAccounts(acc);
  const msg = document.getElementById('masterMsg');
  msg.textContent = '✅ 已儲存';
  setTimeout(() => msg.textContent = '', 2000);
}

// ===== 子帳戶 =====
function renderSubs() {
  const acc = loadAccounts();
  const grid = document.getElementById('subGrid');
  const count = document.getElementById('subCount');
  count.textContent = acc.subs.length;

  if (acc.subs.length >= 9) {
    document.getElementById('addSubBtn').style.display = 'none';
  } else {
    document.getElementById('addSubBtn').style.display = '';
  }

  grid.innerHTML = acc.subs.map((s, i) => `
    <div class="sub-card">
      <div class="name">${s.name || '未命名'}</div>
      <div class="id">${s.id || '無身分證'}</div>
      <div class="count">📈 持股 ${(s.holdings || []).length} 檔</div>
      <div class="actions">
        <button class="btn btn-sm btn-primary" onclick="selectSub(${i})">📂 看持股</button>
        <button class="btn btn-sm btn-gray" onclick="openSubModal(${i})">✏️</button>
        <button class="btn btn-sm btn-red" onclick="delSub(${i})">🗑️</button>
      </div>
    </div>`).join('') || '<p style="color:#64748b;">尚未建立子帳戶</p>';

  // 更新 select
  const sel = document.getElementById('selectSub');
  sel.innerHTML = '<option value="">— 選擇子帳戶 —</option>' +
    acc.subs.map((s, i) => `<option value="${i}">${s.name || '未命名'}（${s.id || ''}）</option>`).join('');
}

function openSubModal(index = -1) {
  document.getElementById('editIndex').value = index;
  document.getElementById('subModalTitle').textContent = index >= 0 ? '✏️ 編輯子帳戶' : '➕ 新增子帳戶';
  document.getElementById('subName').value = '';
  document.getElementById('subId').value = '';
  document.getElementById('subHoldings').value = '';

  if (index >= 0) {
    const acc = loadAccounts();
    const s = acc.subs[index];
    if (s) {
      document.getElementById('subName').value = s.name || '';
      document.getElementById('subId').value = s.id || '';
      document.getElementById('subHoldings').value = (s.holdings || []).join(',');
    }
  }
  document.getElementById('subModal').classList.add('show');
}

function closeSubModal() {
  document.getElementById('subModal').classList.remove('show');
}

function saveSub() {
  const acc = loadAccounts();
  const idx = parseInt(document.getElementById('editIndex').value);
  const name = document.getElementById('subName').value.trim();
  const id = document.getElementById('subId').value.trim();
  const holdings = document.getElementById('subHoldings').value
    .split(/[,，\s]+/).map(x => x.trim()).filter(Boolean);

  if (!name) { alert('請輸入名稱'); return; }

  const data = {name, id, holdings};
  if (idx >= 0) {
    acc.subs[idx] = data;
  } else {
    if (acc.subs.length >= 9) { alert('最多 9 個子帳戶'); return; }
    acc.subs.push(data);
  }
  saveAccounts(acc);
  closeSubModal();
  renderSubs();
}

function delSub(index) {
  if (!confirm('確定刪除這個子帳戶？')) return;
  const acc = loadAccounts();
  acc.subs.splice(index, 1);
  saveAccounts(acc);
  renderSubs();
}

function selectSub(index) {
  document.getElementById('selectSub').value = index;
  loadHoldings();
  document.getElementById('filterBar').style.display = '';
}

// ===== 持股篩選 =====
let currentFilter = 'all';
let currentSubIndex = -1;
let holdingsData = [];

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('#filterBar .btn').forEach(b => b.classList.remove('active'));
  document.getElementById(f === 'all' ? 'fAll' : f === 'hold' ? 'fHold' : 'fNeed').classList.add('active');
  renderHoldings();
}

async function loadHoldings() {
  const idx = parseInt(document.getElementById('selectSub').value);
  if (isNaN(idx)) { alert('請選擇子帳戶'); return; }
  currentSubIndex = idx;
  document.getElementById('filterBar').style.display = '';
  setFilter('all');

  const acc = loadAccounts();
  const sub = acc.subs[idx];
  const codes = (sub.holdings || []).map(c => String(c).trim());

  // 載入資料庫
  const res = await fetch('souvenir_db.json');
  const db = await res.json();

  // 子帳戶持股
  const held = new Set(codes);
  const heldCompanies = db.companies.filter(c => held.has(c.code));

  // 需要補充：未持有 + 2026 有會議（未過最後買進日優先）
  const needCompanies = db.companies.filter(c => !held.has(c.code));

  holdingsData = {
    all: db.companies,
    hold: heldCompanies,
    need: needCompanies,
  };
  document.getElementById('holdStats').textContent =
    `子帳戶 ${sub.name || ''}：全部 ${db.companies.length} 家｜🟢 持有 ${heldCompanies.length} 家｜🟡 可補充 ${needCompanies.length} 家`;
  renderHoldings();
}

function renderHoldings() {
  const rows = holdingsData[currentFilter] || [];
  const tbody = document.getElementById('holdBody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#64748b;">無資料</td></tr>';
    return;
  }
  tbody.innerHTML = rows.slice(0, 300).map(c => {
    const m = c.meetings[c.meetings.length - 1] || {};
    const tag = currentFilter === 'hold'
      ? '<span class="tag tag-hold">持有</span>'
      : currentFilter === 'need' ? '<span class="tag tag-need">補充</span>' : '';
    return `<tr>
      <td><strong>${c.code}</strong></td>
      <td>${c.name}</td>
      <td style="color:#4ade80;">${m.gift || '-'}</td>
      <td>${m.meeting_date || '-'}</td>
      <td>${m.last_buy_date || '-'}</td>
      <td>${tag}</td>
    </tr>`;
  }).join('');
}

// ===== 初始化 =====
renderSubs();
</script>
</body>
</html>
